# Quality gate before deploy: lint + standalone regression scripts.
# Does not deploy or modify deploy.yml behavior.

name: CI

on:
  pull_request:
    branches: [enhancements, main]
  push:
    branches: [enhancements, main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: development
      JWT_SECRET_KEY: ci-test-secret
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      INK_STUDIO_SKIP_SCHEMA_PATCH: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff — syntax and parse errors (glconnect, scripts)
        run: ruff check glconnect scripts --select E9

      - name: Ruff — undefined names (scripts)
        run: ruff check scripts --select F63,F7,F82

      - name: Run standalone regression scripts
        run: |
          set -euo pipefail
          skip=(
            scripts/test_gemini_cover_models.py
            scripts/test_grok_api.py
          )
          for script in scripts/test_*.py; do
            for skipped in "${skip[@]}"; do
              if [[ "$script" == "$skipped" ]]; then
                echo "SKIP (live API credentials required): $script"
                continue 2
              fi
            done
            echo "==> $script"
            python "$script"
          done
