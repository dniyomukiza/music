# Deploy to server on push to enhancements (production branch).
# Fast deploy by default: pull + restart (code bind-mounted). Full Docker rebuild only when
# requirements/Dockerfiles change, images are missing, or workflow_dispatch force_rebuild.
# Secrets: PUSH_TO_GCP (private SSH key). VM: scripts/deploy-production.sh (passwordless sudo for udev optional).

name: Deploy to server

on:
  push:
    branches: [enhancements]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force full Docker image rebuild (pip/apt), ignoring cache
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PUSH_TO_GCP secret
        env:
          PUSH_TO_GCP: ${{ secrets.PUSH_TO_GCP }}
        run: |
          if [ -z "$PUSH_TO_GCP" ]; then
            echo "::error::PUSH_TO_GCP is missing or empty. Repo → Settings → Secrets → Actions."
            exit 1
          fi
          if ! printf '%s' "$PUSH_TO_GCP" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::PUSH_TO_GCP does not look like a private key (expected BEGIN … PRIVATE KEY)."
            exit 1
          fi
          echo "PUSH_TO_GCP is set."

      - name: Write deploy SSH key file
        env:
          PUSH_TO_GCP: ${{ secrets.PUSH_TO_GCP }}
        run: |
          umask 077
          printf '%s\n' "$PUSH_TO_GCP" > .deploy_ssh_key
          chmod 600 .deploy_ssh_key
          ssh-keygen -y -f .deploy_ssh_key >/dev/null

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == true && '1' || '0' }}
        with:
          host: 34.168.111.175
          username: didyom1
          key_path: .deploy_ssh_key
          envs: FORCE_REBUILD
          script_stop: true
          command_timeout: 120m
          script: |
            set -e
            cd /home/didyom1/music
            chmod +x scripts/deploy-production.sh
            FORCE_REBUILD="${FORCE_REBUILD:-0}" bash scripts/deploy-production.sh

      - name: Done
        run: echo "Deploy finished."
