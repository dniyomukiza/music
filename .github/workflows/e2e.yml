# E2E regression gate — Playwright + pytest against a local Flask instance + Postgres service.
# Stripe and slow upload tests are excluded; run those manually with secrets (see docs/TESTING.md).

name: E2E Tests

on:
  pull_request:
    branches: [enhancements, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_TESTING: "1"
      FLASK_ENV: development
      FLASK_APP: run.py
      E2E_BASE_URL: http://127.0.0.1:5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?sslmode=disable
      DB_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?sslmode=disable
      RECAPTCHAPUB: e2e-test-pub
      RECAPTCHAPRIV: e2e-test-priv
      STRIPE_CONNECT_ALLOW_PLATFORM_ONLY: "1"
      SECRET_KEY: ci-e2e-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            e2e/requirements-e2e.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r e2e/requirements-e2e.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Start Flask app
        run: |
          python run.py &
          echo $! > /tmp/flask.pid
          for i in $(seq 1 60); do
            if curl -sf --max-time 3 http://127.0.0.1:5000/health >/dev/null; then
              echo "App healthy after ${i}s"
              exit 0
            fi
            echo "Waiting for app... ($i/60)"
            sleep 5
          done
          echo "::error::Flask app did not become healthy in time"
          exit 1

      - name: Run E2E tests (no Stripe, no slow)
        run: pytest -c e2e/pytest.ini e2e/tests -m "not stripe and not slow" -v --tb=short

      - name: Stop Flask app
        if: always()
        run: |
          if [ -f /tmp/flask.pid ]; then
            kill "$(cat /tmp/flask.pid)" 2>/dev/null || true
          fi
