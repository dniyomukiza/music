<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Platform Voice Agent</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Book Platform Voice Agent</h1>
      <p class="subtitle">Find books, authors, and investment campaigns</p>
      <div id="statusIndicator" class="status disconnected">
        <span class="status-dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <main>
      <div id="messages" class="messages" aria-hidden="true"></div>
      <div id="errorToast" class="error-toast" role="alert"></div>

      <div class="input-area">
        <button type="button" id="audioBtn" class="audio-btn">Start Audio</button>
        <p class="hint">Tap to speak. Works on desktop and mobile.</p>
      </div>
    </main>
  </div>

  <script type="module" src="static/js/app.js"></script>
</body>
</html>
