[pytest]
testpaths = tests
pythonpath = .. .
markers =
    smoke: fast sanity checks (auth, navigation)
    auth: registration and login flows
    author: author-only workflows (profile, create, list)
    buyer: buyer workflows (purchase, library, campaigns)
    stripe: requires Stripe test keys and completes Checkout
    full_workflow: end-to-end cross-role scenarios (may run in parallel)
    journey: alias for full cross-role journeys (written/upload paths)
    slow: long-running uploads or server processing
    payout: Stripe Connect payout setup and earnings
    campaign: patron campaign create and fund
    audiobook: audiobook generation and player
    ai: Gemini writing assistant
    account: reader or author account settings
    edit: author book listing edit
    library: reader and download after purchase
    discovery: marketplace search and filters
    access: role-based nav and route guards
    integration: API/webhook flows without full Stripe Checkout UI
addopts =
    --strict-markers
    -ra
    --tb=short
