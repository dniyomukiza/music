<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLC Media · Live video</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1412; color: #e8eee9; margin: 0; padding: 1.25rem; max-width: 56rem; }
    video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px; }
    p.note { color: #8a9a90; font-size: 0.9rem; margin-top: 1rem; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>Live video</h1>
  <video id="video" controls playsinline autoplay muted></video>
  <p class="note">Manifest: <code>/hls/live.m3u8</code> (nginx → Liquidsoap :8920). Debug JSON: <a href="/api/hls-status"><code>/api/hls-status</code></a> (use this — not <code>/hls/status</code>, which can hit Liquidsoap and 404).</p>
  <p><a href="/">← Home</a></p>
  <script src="/static/glc-hls-live.js"></script>
  <script>
  (function () {
    var el = document.getElementById("video");
    if (el) window.GlcLiveHls.attach(el, "/hls/live.m3u8");
  })();
  </script>
</body>
</html>
