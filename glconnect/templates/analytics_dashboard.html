<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Ndotonic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='glc-theme.css') }}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: #060807;
            background-image:
                radial-gradient(ellipse 120% 80% at 10% -20%, rgba(201, 162, 39, 0.07), transparent 50%),
                radial-gradient(ellipse 90% 70% at 100% 25%, rgba(42, 61, 50, 0.4), transparent 55%);
            background-attachment: fixed;
            color: #e8ece9;
            min-height: 100vh;
            padding: clamp(1.25rem, 3vw, 2rem);
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .page-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.75rem;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            margin-bottom: 0.35rem;
        }
        .subtitle { color: #aeb4b0; font-size: 0.95rem; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.65rem;
        }
        .toolbar label {
            font-size: 0.85rem;
            color: #aeb4b0;
        }
        .toolbar select,
        .refresh-btn {
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid rgba(201, 162, 39, 0.25);
            background: rgba(12, 15, 14, 0.92);
            color: #e8ece9;
            padding: 0.55rem 0.85rem;
        }
        .refresh-btn {
            background: linear-gradient(145deg, #c9a227, #a88416);
            color: #060807;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        .refresh-btn:hover { filter: brightness(1.06); }
        .refresh-btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .summary {
            display: inline-flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(201, 162, 39, 0.2);
            background: rgba(12, 15, 14, 0.92);
        }
        .summary strong {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            color: #e0bc3a;
        }
        .section {
            background: rgba(12, 15, 14, 0.92);
            border: 1px solid rgba(201, 162, 39, 0.2);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        .section h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #e8ece9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.7rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(201, 162, 39, 0.12);
        }
        th {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #e0bc3a;
            font-weight: 600;
        }
        td { color: #e8ece9; font-size: 0.92rem; }
        td code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.82rem;
            color: #d4ddd8;
            word-break: break-all;
        }
        .views-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
        .bar-cell { width: 38%; min-width: 140px; }
        .bar-track {
            height: 8px;
            border-radius: 999px;
            background: rgba(201, 162, 39, 0.12);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #a88416, #e0bc3a);
        }
        .muted { color: #8b9690; font-size: 0.85rem; }
        .loading, .empty { text-align: center; padding: 2rem 1rem; color: #aeb4b0; }
        .error {
            background: rgba(60, 20, 24, 0.5);
            color: #f5b8bf;
            border: 1px solid rgba(220, 53, 69, 0.4);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        @media (max-width: 720px) {
            .bar-cell { display: none; }
            th.bar-col, td.bar-cell { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-head">
            <div>
                <h1>Analytics</h1>
                <p class="subtitle">Views per day and endpoint traffic</p>
            </div>
            <div class="toolbar">
                <label for="days-select">Range</label>
                <select id="days-select" aria-label="Date range">
                    <option value="7">Last 7 days</option>
                    <option value="14">Last 14 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                </select>
                <button type="button" class="refresh-btn" id="refresh-btn">Refresh</button>
            </div>
        </div>

        <div id="error-container"></div>
        <div id="summary" class="summary" hidden>
            <span class="muted">Total views</span>
            <strong id="total-views">0</strong>
            <span class="muted" id="range-label">(30 days)</span>
        </div>

        <section class="section" aria-labelledby="daily-heading">
            <h2 id="daily-heading">Views per day</h2>
            <div id="daily-views" class="loading">Loading daily views…</div>
        </section>

        <section class="section" aria-labelledby="endpoints-heading">
            <h2 id="endpoints-heading">Endpoints visited</h2>
            <div id="endpoints" class="loading">Loading endpoints…</div>
        </section>
    </div>

    <script>
    (function () {
        var refreshBtn = document.getElementById('refresh-btn');
        var daysSelect = document.getElementById('days-select');
        var errorContainer = document.getElementById('error-container');
        var summaryEl = document.getElementById('summary');
        var totalViewsEl = document.getElementById('total-views');
        var rangeLabelEl = document.getElementById('range-label');

        function formatNumber(num) {
            return new Intl.NumberFormat().format(num);
        }

        function formatDate(isoDate) {
            var parts = isoDate.split('-');
            if (parts.length !== 3) return isoDate;
            var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateTime(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString();
        }

        async function fetchDashboard(days) {
            var url = '/_analytics/api/dashboard?days=' + encodeURIComponent(days) + '&_t=' + Date.now();
            var response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            var data = await response.json();
            if (!data.success) throw new Error(data.error || 'Request failed');
            return data;
        }

        function renderDailyViews(rows) {
            var container = document.getElementById('daily-views');
            if (!rows.length) {
                container.innerHTML = '<p class="empty">No views recorded in this range.</p>';
                return;
            }
            var maxViews = Math.max.apply(null, rows.map(function (r) { return r.views; }));
            var reversed = rows.slice().reverse();
            container.innerHTML =
                '<table><thead><tr>' +
                '<th>Date</th><th>Views</th><th class="bar-col bar-cell">Volume</th>' +
                '</tr></thead><tbody>' +
                reversed.map(function (row) {
                    var width = maxViews ? Math.round((row.views / maxViews) * 100) : 0;
                    return '<tr>' +
                        '<td>' + formatDate(row.date) + '</td>' +
                        '<td class="views-cell">' + formatNumber(row.views) + '</td>' +
                        '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:' + width + '%"></div></div></td>' +
                        '</tr>';
                }).join('') +
                '</tbody></table>';
        }

        function renderEndpoints(rows) {
            var container = document.getElementById('endpoints');
            if (!rows.length) {
                container.innerHTML = '<p class="empty">No endpoint visits in this range.</p>';
                return;
            }
            container.innerHTML =
                '<table><thead><tr>' +
                '<th>Endpoint</th><th>Views</th><th>Last visited</th>' +
                '</tr></thead><tbody>' +
                rows.map(function (row) {
                    return '<tr>' +
                        '<td><code>' + row.endpoint + '</code></td>' +
                        '<td class="views-cell">' + formatNumber(row.views) + '</td>' +
                        '<td class="muted">' + formatDateTime(row.last_visited) + '</td>' +
                        '</tr>';
                }).join('') +
                '</tbody></table>';
        }

        async function loadDashboard() {
            var days = daysSelect.value;
            var originalText = refreshBtn.textContent;
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Loading…';
            errorContainer.innerHTML = '';

            try {
                var data = await fetchDashboard(days);
                totalViewsEl.textContent = formatNumber(data.total_views);
                rangeLabelEl.textContent = '(' + data.days + ' days)';
                summaryEl.hidden = false;
                renderDailyViews(data.daily_views || []);
                renderEndpoints(data.endpoints || []);
            } catch (err) {
                document.getElementById('daily-views').innerHTML = '<p class="empty">Unable to load data.</p>';
                document.getElementById('endpoints').innerHTML = '<p class="empty">Unable to load data.</p>';
                errorContainer.innerHTML = '<div class="error">Could not load analytics: ' + err.message + '</div>';
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = originalText;
            }
        }

        refreshBtn.addEventListener('click', loadDashboard);
        daysSelect.addEventListener('change', loadDashboard);
        loadDashboard();
        setInterval(loadDashboard, 60000);
    })();
    </script>
    {% include 'includes/_ndotonic_mission_footer.html' %}
</body>
</html>
