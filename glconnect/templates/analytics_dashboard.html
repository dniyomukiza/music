<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Music App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .dashboard-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dashboard-subtitle {
            color: #718096;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #718096;
            font-size: 1rem;
            font-weight: 500;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #718096;
        }

        .error {
            color: #e53e3e;
            text-align: center;
            padding: 20px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .last-updated {
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 10px;
            }
            
            .dashboard-title {
                font-size: 2rem;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1 class="dashboard-title">
                <i class="fas fa-chart-line"></i>
                Analytics Dashboard
            </h1>
            <p class="dashboard-subtitle">Real-time insights into your music app usage</p>
            <button class="refresh-btn" onclick="loadAnalytics()">
                <i class="fas fa-sync-alt"></i> Refresh Data
            </button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading analytics...
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3 class="chart-title">
                    <i class="fas fa-users"></i>
                    Device Breakdown
                </h3>
                <div class="chart-container">
                    <canvas id="deviceChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3 class="chart-title">
                    <i class="fas fa-globe"></i>
                    Browser Usage
                </h3>
                <div class="chart-container">
                    <canvas id="browserChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3 class="chart-title">
                    <i class="fas fa-clock"></i>
                    Peak Hours
                </h3>
                <div class="chart-container">
                    <canvas id="peakHoursChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3 class="chart-title">
                    <i class="fas fa-star"></i>
                    Feature Usage
                </h3>
                <div class="chart-container">
                    <canvas id="featuresChart"></canvas>
                </div>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">
            Last updated: <span id="updateTime">Loading...</span>
        </div>
    </div>

    <script>
        let charts = {};

        async function loadAnalytics() {
            try {
                // Load summary data
                const summaryResponse = await fetch('/usage-analytics/api/usage-analytics/summary');
                const summary = await summaryResponse.json();

                if (summary.error) {
                    throw new Error(summary.error);
                }

                // Update stats cards
                updateStatsCards(summary);

                // Load and render charts
                await loadCharts();

                // Update last updated time
                document.getElementById('updateTime').textContent = new Date().toLocaleString();

            } catch (error) {
                console.error('Error loading analytics:', error);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        Error loading analytics: ${error.message}
                    </div>
                `;
            }
        }

        function updateStatsCards(summary) {
            const statsGrid = document.getElementById('statsGrid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="stat-value">${summary.total_visits.toLocaleString()}</div>
                    <div class="stat-label">Total Visits</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <div class="stat-value">${summary.unique_visitors.toLocaleString()}</div>
                    <div class="stat-label">Unique Visitors</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
                        <i class="fas fa-calendar"></i>
                    </div>
                    <div class="stat-value">${summary.duration_days}</div>
                    <div class="stat-label">Days Active</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
                        <i class="fas fa-chart-bar"></i>
                    </div>
                    <div class="stat-value">${summary.top_pages[0] ? summary.top_pages[0][1] : 0}</div>
                    <div class="stat-label">Most Popular Page</div>
                </div>
            `;
        }

        async function loadCharts() {
            try {
                // Load device data
                const devicesResponse = await fetch('/usage-analytics/api/usage-analytics/devices');
                const devicesData = await devicesResponse.json();
                renderDeviceChart(devicesData.devices);

                // Load features data
                const featuresResponse = await fetch('/usage-analytics/api/usage-analytics/features');
                const featuresData = await featuresResponse.json();
                renderFeaturesChart(featuresData);

                // Load peak hours data
                const peakHoursResponse = await fetch('/usage-analytics/api/usage-analytics/peak-hours');
                const peakHoursData = await peakHoursResponse.json();
                renderPeakHoursChart(peakHoursData);

                // Load browser data
                const browsersResponse = await fetch('/usage-analytics/api/usage-analytics/devices');
                const browsersData = await browsersResponse.json();
                renderBrowserChart(browsersData.browsers);

            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }

        function renderDeviceChart(devices) {
            const ctx = document.getElementById('deviceChart').getContext('2d');
            
            if (charts.device) {
                charts.device.destroy();
            }

            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe'];
            
            charts.device = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(devices),
                    datasets: [{
                        data: Object.values(devices),
                        backgroundColor: colors.slice(0, Object.keys(devices).length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function renderBrowserChart(browsers) {
            const ctx = document.getElementById('browserChart').getContext('2d');
            
            if (charts.browser) {
                charts.browser.destroy();
            }

            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe'];
            
            charts.browser = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(browsers),
                    datasets: [{
                        data: Object.values(browsers),
                        backgroundColor: colors.slice(0, Object.keys(browsers).length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function renderPeakHoursChart(peakHours) {
            const ctx = document.getElementById('peakHoursChart').getContext('2d');
            
            if (charts.peakHours) {
                charts.peakHours.destroy();
            }

            const hours = Object.keys(peakHours).map(h => `${h}:00`).slice(0, 12);
            const visits = Object.values(peakHours).slice(0, 12);
            
            charts.peakHours = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: 'Visits',
                        data: visits,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function renderFeaturesChart(features) {
            const ctx = document.getElementById('featuresChart').getContext('2d');
            
            if (charts.features) {
                charts.features.destroy();
            }

            const featureNames = Object.keys(features).map(f => f.replace('feature_', '').replace('_', ' ').toUpperCase());
            const featureValues = Object.values(features);
            
            charts.features = new Chart(ctx, {
                type: 'horizontalBar',
                data: {
                    labels: featureNames,
                    datasets: [{
                        label: 'Usage',
                        data: featureValues,
                        backgroundColor: 'rgba(118, 75, 162, 0.8)',
                        borderColor: 'rgba(118, 75, 162, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Load analytics on page load
        document.addEventListener('DOMContentLoaded', loadAnalytics);
    </script>
</body>
</html>
