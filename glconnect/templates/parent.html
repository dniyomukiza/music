<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}technow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='glc-theme.css') }}">

  {% block head %}
  {% endblock %}
</head>
<body>

<header class="header">
  <div class="header-background">
    <a href="{{ url_for('routes.about') }}" class="logo"></a>
  </div>
  <nav>
    <ul class="nav-links">
    </ul>
  </nav>
</header>

<main class="content">
  {% block content %}
    <form method="post" enctype="multipart/form-data">
      <textarea name="editor1" id="editor1" rows="10" cols="50" placeholder="Enter your text here..."></textarea>
      <button type="submit">Submit</button>
    </form>
  {% endblock %}
</main>
    {% include 'includes/_ndotonic_mission_footer.html' %}


</body>
</html>
