<section class="hero-wrap{% if legacy_hero_compact|default(false) %} hero-wrap--compact{% endif %}" aria-labelledby="legacy-hero-heading">

        <div class="hero-copy">
            <h1 id="legacy-hero-heading" class="display">The epicenter of <em>premium</em> content</h1>

            <div class="hero-card hero-card--steps">
                <div class="stat-row">
                    <div class="stat">
                        <strong>01</strong>

                    </div>
                    <div class="stat">
                        <strong>02</strong>
                        <span>Imagine</span>
                    </div>
                    <div class="stat">
                        <strong>03</strong>
                        <span>Create</span>
                    </div>
                </div>
            </div>
        </div>
