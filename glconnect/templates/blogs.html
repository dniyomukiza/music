<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blogs.css') }}">
</head>
<body>
    <div style="margin-bottom: 20px;">
        <div class="button-container">
            <a href="{{ url_for('blog.logout') }}" class="btn">Logout</a>
            <a href="{{ url_for('routes1.login') }}" class="btn">Create Blog</a>
        </div>

        {% for i in range(0, posts|length, 2) %}
        <div style="display: flex; margin-bottom: 20px;">
            {% for post in posts[i:i+2] %}
            <div style="flex: 1; margin-right: 20px;">
                <div style="padding: 10px; margin-bottom: 10px;">
                    <div style="font-size: 12px; margin-bottom: 5px;">
                        <small>Posted by: {{ post.author.username }}</small>
                        <br>
                        <small>Date: {{ post.date_posted.strftime("%Y-%m-%d") }}</small>
                    </div>
                    <h2 style="font-size: 24px; margin-bottom: 10px;">
                        <a href="{{ url_for('blog.update', post_id=post.id) }}" style="color: rgb(70, 24, 24); text-decoration: none;">{{ post.title }}</a>
                    </h2>
                    <p style="font-size: 16px; margin-bottom: 10px;">{{ post.content | safe }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
