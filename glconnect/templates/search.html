{% extends "base.html" %}

{% block images %}
    <link rel="stylesheet" href="{{ url_for('static', filename='./search.css') }}">

    <div class="container">
        <form action="/search" method="POST">
            <input type="text" placeholder="Enter song name" id="song_query" name="song_query" required>
            <button type="submit">Search</button>
        </form>

        {% if error_message %}
            <p>{{ error_message }}</p>
        {% elif song_result %}
            <h2>{{ song_result.name }} by {{ song_result.artist }}</h2>
            <button id="playButton">Play</button>

            <!-- Audio player with controls -->
            <audio id="audioPlayer" class="hidden" controls>
                <source id="audioSource" type="audio/ogg">
            </audio>
        {% endif %}
    </div>

    <script>
        document.getElementById("playButton")?.addEventListener("click", function() {
            const songPath = "{{ song_result.path }}";  // Get the song path dynamically
            const audio = document.getElementById("audioPlayer");
            const audioSource = document.getElementById("audioSource");

            // Log the song path to ensure it is correct
            console.log("Song path:", songPath);

            // Set the source and load the audio
            audioSource.src = songPath;
            audio.load();  // Load the new song

            // Show the audio controls and play the audio
            audio.classList.remove("hidden");  // Show audio controls
            audio.play();  // Play the song

            // Handle errors if the audio fails to load
            audio.onerror = function() {
                alert("Error loading the audio. Please try again.");
            };
        });
    </script>
{% endblock %}
