<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Book - Ink Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='book_platform.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('book_platform.dashboard') }}">
                <i class="fas fa-pen-fancy"></i> Ink Studio
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('book_platform.dashboard') }}">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3><i class="fas fa-plus-circle"></i> Create New Book</h3>
                        <p class="text-muted">Start your writing journey</p>
                    </div>
                    <div class="card-body">
                        <form id="createBookForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Book Title *</label>
                                <input type="text" class="form-control" id="title" name="title" required placeholder="Enter your book title">
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Brief description of your book..."></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="genre" class="form-label">Genre</label>
                                        <select class="form-select" id="genre" name="genre">
                                            <option value="">Select a genre</option>
                                            <option value="fiction">Fiction</option>
                                            <option value="non-fiction">Non-Fiction</option>
                                            <option value="mystery">Mystery</option>
                                            <option value="romance">Romance</option>
                                            <option value="sci-fi">Science Fiction</option>
                                            <option value="fantasy">Fantasy</option>
                                            <option value="thriller">Thriller</option>
                                            <option value="biography">Biography</option>
                                            <option value="self-help">Self-Help</option>
                                            <option value="business">Business</option>
                                            <option value="history">History</option>
                                            <option value="poetry">Poetry</option>
                                            <option value="children">Children's</option>
                                            <option value="young-adult">Young Adult</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="targetAudience" class="form-label">Target Audience</label>
                                        <select class="form-select" id="targetAudience" name="target_audience">
                                            <option value="">Select target audience</option>
                                            <option value="children">Children (0-12)</option>
                                            <option value="young-adult">Young Adult (13-18)</option>
                                            <option value="adult">Adult (18+)</option>
                                            <option value="senior">Senior (65+)</option>
                                            <option value="general">General Audience</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Writing Goals</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="personal" id="goal-personal" name="goals">
                                            <label class="form-check-label" for="goal-personal">Personal Project</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="publish" id="goal-publish" name="goals">
                                            <label class="form-check-label" for="goal-publish">Publish & Sell</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="collaborate" id="goal-collaborate" name="goals">
                                            <label class="form-check-label" for="goal-collaborate">Collaborate with Others</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="learn" id="goal-learn" name="goals">
                                            <label class="form-check-label" for="goal-learn">Learn & Practice</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="alert alert-info">
                                <i class="fas fa-info-circle"></i>
                                <strong>Getting Started:</strong> You can always edit these details later. Focus on getting your ideas down first!
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-book"></i> Create Book & Start Writing
                                </button>
                                <a href="{{ url_for('book_platform.dashboard') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        document.getElementById('createBookForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                title: formData.get('title'),
                description: formData.get('description'),
                genre: formData.get('genre'),
                target_audience: formData.get('target_audience'),
                goals: Array.from(document.querySelectorAll('input[name="goals"]:checked')).map(cb => cb.value)
            };
            
            if (!data.title.trim()) {
                alert('Please enter a book title');
                return;
            }
            
            try {
                const response = await fetch('{{ url_for("book_platform.create_book") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = `/mybook/books/${result.book_id}`;
                } else {
                    alert('Error creating book. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error creating book. Please try again.');
            }
        });
    </script>
</body>
</html>
