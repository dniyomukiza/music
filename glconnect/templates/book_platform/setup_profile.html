<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Profile - Ink Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='book_platform.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('book_platform.dashboard') }}">
                <i class="fas fa-pen-fancy"></i> Ink Studio
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3><i class="fas fa-user-edit"></i> Setup Your Author Profile</h3>
                        <p class="text-muted">Tell us about yourself as a writer</p>
                    </div>
                    <div class="card-body">
                        <form id="profileSetupForm">
                            <div class="mb-3">
                                <label for="penName" class="form-label">Pen Name</label>
                                <input type="text" class="form-control" id="penName" name="pen_name" placeholder="Your author name">
                                <div class="form-text">This will be displayed as your author name. Leave blank to use your username.</div>
                            </div>

                            <div class="mb-3">
                                <label for="bio" class="form-label">Bio</label>
                                <textarea class="form-control" id="bio" name="bio" rows="4" placeholder="Tell us about yourself as a writer..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="website" class="form-label">Website</label>
                                <input type="url" class="form-control" id="website" name="website" placeholder="https://yourwebsite.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Social Media Links</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="input-group mb-2">
                                            <span class="input-group-text"><i class="fab fa-twitter"></i></span>
                                            <input type="url" class="form-control" name="twitter" placeholder="Twitter profile">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group mb-2">
                                            <span class="input-group-text"><i class="fab fa-instagram"></i></span>
                                            <input type="url" class="form-control" name="instagram" placeholder="Instagram profile">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group mb-2">
                                            <span class="input-group-text"><i class="fab fa-facebook"></i></span>
                                            <input type="url" class="form-control" name="facebook" placeholder="Facebook profile">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group mb-2">
                                            <span class="input-group-text"><i class="fab fa-linkedin"></i></span>
                                            <input type="url" class="form-control" name="linkedin" placeholder="LinkedIn profile">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="writingExperience" class="form-label">Writing Experience</label>
                                <textarea class="form-control" id="writingExperience" name="writing_experience" rows="3" placeholder="Describe your writing background and experience..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Preferred Genres</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="fiction" id="genre-fiction" name="genres">
                                            <label class="form-check-label" for="genre-fiction">Fiction</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="non-fiction" id="genre-nonfiction" name="genres">
                                            <label class="form-check-label" for="genre-nonfiction">Non-Fiction</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="mystery" id="genre-mystery" name="genres">
                                            <label class="form-check-label" for="genre-mystery">Mystery</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="romance" id="genre-romance" name="genres">
                                            <label class="form-check-label" for="genre-romance">Romance</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="sci-fi" id="genre-scifi" name="genres">
                                            <label class="form-check-label" for="genre-scifi">Science Fiction</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="fantasy" id="genre-fantasy" name="genres">
                                            <label class="form-check-label" for="genre-fantasy">Fantasy</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="thriller" id="genre-thriller" name="genres">
                                            <label class="form-check-label" for="genre-thriller">Thriller</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="biography" id="genre-biography" name="genres">
                                            <label class="form-check-label" for="genre-biography">Biography</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save"></i> Save Profile & Continue
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        document.getElementById('profileSetupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                pen_name: formData.get('pen_name'),
                bio: formData.get('bio'),
                website: formData.get('website'),
                social_links: {
                    twitter: formData.get('twitter'),
                    instagram: formData.get('instagram'),
                    facebook: formData.get('facebook'),
                    linkedin: formData.get('linkedin')
                },
                writing_experience: formData.get('writing_experience'),
                genres: Array.from(document.querySelectorAll('input[name="genres"]:checked')).map(cb => cb.value)
            };
            
            try {
                const response = await fetch('{{ url_for("book_platform.setup_profile") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = result.redirect;
                } else {
                    alert('Error setting up profile. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error setting up profile. Please try again.');
            }
        });
    </script>
    {% include 'book_platform/includes/live_radio_bar.html' %}
</body>
</html>
