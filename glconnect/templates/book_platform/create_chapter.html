<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Chapter - Ink Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/book_platform.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('book_platform.dashboard') }}">
                <i class="fas fa-pen-fancy"></i> Ink Studio
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('book_platform.dashboard') }}">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fas fa-plus-circle"></i> Create New Chapter
                        </h4>
                        <small class="text-muted">Add a new chapter to "{{ book.title }}"</small>
                    </div>
                    <div class="card-body">
                        <form id="createChapterForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Chapter Title *</label>
                                <input type="text" class="form-control" id="title" name="title" required
                                       placeholder="Enter chapter title">
                            </div>

                            <div class="mb-3">
                                <label for="chapter_number" class="form-label">Chapter Number</label>
                                <input type="number" class="form-control" id="chapter_number" name="chapter_number" 
                                       min="1" value="{{ next_chapter_number }}">
                            </div>

                            <div class="mb-3">
                                <label for="summary" class="form-label">Chapter Summary</label>
                                <textarea class="form-control" id="summary" name="summary" rows="3"
                                          placeholder="Brief summary of this chapter"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="content" class="form-label">Chapter Content</label>
                                <div id="editor" style="height: 400px;"></div>
                                <textarea id="content" name="content" style="display: none;"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="word_count_target" class="form-label">Target Word Count</label>
                                <input type="number" class="form-control" id="word_count_target" name="word_count_target" 
                                       min="0" placeholder="Optional target word count">
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="is_published" name="is_published">
                                    <label class="form-check-label" for="is_published">
                                        Publish this chapter immediately
                                    </label>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{{ url_for('book_platform.view_book', book_id=book.id) }}" 
                                   class="btn btn-secondary me-md-2">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Create Chapter
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <script src="{{ url_for('static', filename='ai_assistant.js') }}"></script>
    <script>
        let editor;

        // Initialize CKEditor with full features
        ClassicEditor
            .create(document.querySelector('#editor'), {
                toolbar: {
                    items: [
                        'heading', '|',
                        'bold', 'italic', 'underline', 'strikethrough', 'subscript', 'superscript', '|',
                        'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', '|',
                        'bulletedList', 'numberedList', 'todoList', '|',
                        'outdent', 'indent', '|',
                        'alignment', '|',
                        'blockQuote', 'insertTable', '|',
                        'link', 'imageUpload', 'mediaEmbed', '|',
                        'horizontalLine', 'pageBreak', '|',
                        'code', 'codeBlock', '|',
                        'findAndReplace', '|',
                        'undo', 'redo', '|',
                        'sourceEditing'
                    ]
                },
                language: 'en',
                fontSize: {
                    options: [9, 11, 13, 'default', 17, 19, 21, 24, 28, 32, 36, 48, 60, 72]
                },
                fontFamily: {
                    options: [
                        'default',
                        'Arial, Helvetica, sans-serif',
                        'Courier New, Courier, monospace',
                        'Georgia, serif',
                        'Lucida Sans Unicode, Lucida Grande, sans-serif',
                        'Tahoma, Geneva, sans-serif',
                        'Times New Roman, Times, serif',
                        'Trebuchet MS, Helvetica, sans-serif',
                        'Verdana, Geneva, sans-serif'
                    ]
                },
                fontColor: {
                    colors: [
                        { color: 'hsl(0, 0%, 0%)', label: 'Black' },
                        { color: 'hsl(0, 0%, 30%)', label: 'Dim grey' },
                        { color: 'hsl(0, 0%, 60%)', label: 'Grey' },
                        { color: 'hsl(0, 0%, 90%)', label: 'Light grey' },
                        { color: 'hsl(0, 0%, 100%)', label: 'White', hasBorder: true },
                        { color: 'hsl(0, 75%, 60%)', label: 'Red' },
                        { color: 'hsl(30, 75%, 60%)', label: 'Orange' },
                        { color: 'hsl(60, 75%, 60%)', label: 'Yellow' },
                        { color: 'hsl(90, 75%, 60%)', label: 'Light green' },
                        { color: 'hsl(120, 75%, 60%)', label: 'Green' },
                        { color: 'hsl(150, 75%, 60%)', label: 'Aquamarine' },
                        { color: 'hsl(180, 75%, 60%)', label: 'Turquoise' },
                        { color: 'hsl(210, 75%, 60%)', label: 'Light blue' },
                        { color: 'hsl(240, 75%, 60%)', label: 'Blue' },
                        { color: 'hsl(270, 75%, 60%)', label: 'Purple' }
                    ]
                },
                fontBackgroundColor: {
                    colors: [
                        { color: 'hsl(0, 0%, 0%)', label: 'Black' },
                        { color: 'hsl(0, 0%, 30%)', label: 'Dim grey' },
                        { color: 'hsl(0, 0%, 60%)', label: 'Grey' },
                        { color: 'hsl(0, 0%, 90%)', label: 'Light grey' },
                        { color: 'hsl(0, 0%, 100%)', label: 'White', hasBorder: true },
                        { color: 'hsl(0, 75%, 60%)', label: 'Red' },
                        { color: 'hsl(30, 75%, 60%)', label: 'Orange' },
                        { color: 'hsl(60, 75%, 60%)', label: 'Yellow' },
                        { color: 'hsl(90, 75%, 60%)', label: 'Light green' },
                        { color: 'hsl(120, 75%, 60%)', label: 'Green' },
                        { color: 'hsl(150, 75%, 60%)', label: 'Aquamarine' },
                        { color: 'hsl(180, 75%, 60%)', label: 'Turquoise' },
                        { color: 'hsl(210, 75%, 60%)', label: 'Light blue' },
                        { color: 'hsl(240, 75%, 60%)', label: 'Blue' },
                        { color: 'hsl(270, 75%, 60%)', label: 'Purple' }
                    ]
                },
                indentBlock: {
                    offset: 40,
                    unit: 'px'
                },
                alignment: {
                    options: ['left', 'center', 'right', 'justify']
                },
                list: {
                    properties: {
                        styles: true,
                        startIndex: true,
                        reversed: true
                    }
                },
                table: {
                    contentToolbar: [
                        'tableColumn',
                        'tableRow',
                        'mergeTableCells',
                        'tableProperties',
                        'tableCellProperties'
                    ]
                },
                image: {
                    toolbar: [
                        'imageTextAlternative',
                        'imageStyle:inline',
                        'imageStyle:block',
                        'imageStyle:side',
                        '|',
                        'toggleImageCaption',
                        'imageResize'
                    ],
                    resizeOptions: [
                        {
                            name: 'imageResize:original',
                            label: 'Original',
                            value: null
                        },
                        {
                            name: 'imageResize:25',
                            label: '25%',
                            value: '25'
                        },
                        {
                            name: 'imageResize:50',
                            label: '50%',
                            value: '50'
                        },
                        {
                            name: 'imageResize:75',
                            label: '75%',
                            value: '75'
                        }
                    ]
                },
                link: {
                    decorators: {
                        openInNewTab: {
                            mode: 'manual',
                            label: 'Open in a new tab',
                            attributes: {
                                target: '_blank',
                                rel: 'noopener noreferrer'
                            }
                        }
                    }
                },
                mediaEmbed: {
                    previewsInData: true
                }
            })
            .then(newEditor => {
                editor = newEditor;
                
                // Configure image upload adapter
                editor.plugins.get('FileRepository').createUploadAdapter = function(loader) {
                    return new UploadAdapter(loader);
                };
            })
            .catch(error => {
                console.error('Error initializing CKEditor:', error);
            });

        // Custom upload adapter for CKEditor
        class UploadAdapter {
            constructor(loader) {
                this.loader = loader;
            }

            upload() {
                return this.loader.file
                    .then(file => new Promise((resolve, reject) => {
                        const data = new FormData();
                        data.append('upload', file);
                        
                        // Get book and chapter IDs from URL
                        const urlParts = window.location.pathname.split('/');
                        const bookId = urlParts[urlParts.indexOf('books') + 1];
                        const chapterId = urlParts[urlParts.indexOf('chapters') + 1];
                        
                        fetch(`/mybook/books/${bookId}/chapters/${chapterId}/upload-image`, {
                            method: 'POST',
                            body: data
                        })
                        .then(response => response.json())
                        .then(result => {
                            if (result.success) {
                                resolve({ default: result.url });
                            } else {
                                reject(result.error || 'Upload failed');
                            }
                        })
                        .catch(error => {
                            reject('Upload failed: ' + error.message);
                        });
                    }));
            }

            abort() {
                // Implement abort if needed
            }
        }

        // Form submission
        document.getElementById('createChapterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get content from editor
            if (editor) {
                document.getElementById('content').value = editor.getData();
            }
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('{{ url_for("book_platform.create_chapter", book_id=book.id) }}', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Show success message
                    showNotification('Chapter created successfully!', 'success');
                    
                    // Redirect to book view
                    setTimeout(() => {
                        window.location.href = result.redirect || '{{ url_for("book_platform.view_book", book_id=book.id) }}';
                    }, 1500);
                } else {
                    showNotification(result.error || 'Failed to create chapter', 'error');
                }
            } catch (error) {
                console.error('Error creating chapter:', error);
                showNotification('An error occurred while creating the chapter', 'error');
            }
        });

        // Notification function
        function showNotification(message, type = 'info') {
            const alertClass = type === 'success' ? 'alert-success' : 
                              type === 'error' ? 'alert-danger' : 'alert-info';
            
            const notification = document.createElement('div');
            notification.className = `alert ${alertClass} alert-dismissible fade show position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            notification.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(notification);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 5000);
        }

        // Auto-save functionality
        let autoSaveTimeout;
        if (editor) {
            editor.model.document.on('change:data', () => {
                clearTimeout(autoSaveTimeout);
                autoSaveTimeout = setTimeout(() => {
                    // Auto-save logic could be implemented here
                    console.log('Auto-save triggered');
                }, 3000);
            });
        }
    </script>
</body>
</html>
