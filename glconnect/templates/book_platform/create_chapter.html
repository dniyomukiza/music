<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Chapter | Ink Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
          --bg-dark: #060807;
          --bg-panel: rgba(17, 24, 39, 0.6);
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --accent-primary: #c9a227;
          --accent-secondary: #e0bc3a;
          --border-light: rgba(255, 255, 255, 0.08);
          --glass-bg: rgba(15, 23, 42, 0.75);
          --input-bg: rgba(15, 23, 42, 0.8);
          --gradient-accent: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(circle at top right, #1a221c, #060807 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Syne', sans-serif;
            color: #fff;
        }

        /* Navbar */
        .navbar {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            padding: 1rem 0;
        }
        
        .navbar-brand {
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link { color: var(--text-muted) !important; transition: 0.3s; }
        .nav-link:hover { color: #fff !important; }

        /* Card / Form Container */
        .card {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        /* Form Controls */
        .form-label {
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-light);
            color: #fff;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--accent-primary);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .form-check-label {
            color: var(--text-muted);
        }

        /* Editor Styling Wrapper Check */
        .ck.ck-editor__main > .ck-editor__editable {
            background-color: #fcfcfc !important; /* Keep editor paper white for writing */
            color: #111 !important;
            border-radius: 0 0 8px 8px !important;
            min-height: 400px;
        }
        .ck.ck-toolbar {
            background: #e2e8f0 !important;
            border-radius: 8px 8px 0 0 !important;
            border: none !important;
        }

        /* Buttons */
        .btn-primary {
            background: var(--gradient-accent);
            border: none;
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            font-family: 'Syne', sans-serif;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5);
            background: linear-gradient(135deg, #0284c7, #0f766e);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 500;
            transition: all 0.3s;
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('book_platform.dashboard') }}">
                <i class="fas fa-layer-group"></i> Ink Studio
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('book_platform.dashboard') }}">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="margin-top: 5rem;">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1">
                                <i class="fas fa-plus-circle me-2 text-info"></i> Create New Chapter
                            </h4>
                            <small class="text-muted">Drafting for "{{ book.title }}"</small>
                        </div>
                    </div>
                    <div class="card-body">
                        <form id="createChapterForm">
                            <div class="row">
                                <div class="col-md-9 mb-4">
                                    <label for="title" class="form-label">Chapter Title *</label>
                                    <input type="text" class="form-control" id="title" name="title" required
                                           placeholder="Enter a compelling title">
                                </div>
                                <div class="col-md-3 mb-4">
                                    <label for="chapter_number" class="form-label">Chapter No.</label>
                                    <input type="number" class="form-control" id="chapter_number" name="chapter_number" 
                                           min="1" value="{{ next_chapter_number }}">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="summary" class="form-label">Chapter Summary / Notes (Visible to you)</label>
                                <textarea class="form-control" id="summary" name="summary" rows="2"
                                          placeholder="Brief outline or summary for this chapter"></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="content" class="form-label">Chapter Manuscript</label>
                                <div id="editor" style="height: 400px;"></div>
                                <textarea id="content" name="content" style="display: none;"></textarea>
                            </div>

                            <div class="row align-items-center mb-5">
                                <div class="col-md-4">
                                    <label for="word_count_target" class="form-label">Target Word Count</label>
                                    <input type="number" class="form-control" id="word_count_target" name="word_count_target" 
                                           min="0" placeholder="e.g. 2500">
                                </div>
                                <div class="col-md-8 mt-4 mt-md-0 d-flex justify-content-md-end">
                                    <div class="form-check form-switch mt-md-4 me-3">
                                        <input class="form-check-input" type="checkbox" id="is_published" name="is_published" style="cursor:pointer">
                                        <label class="form-check-label" for="is_published" style="cursor:pointer">
                                            Publish Immediatley
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-3 pt-3" style="border-top: 1px solid var(--border-light);">
                                <a href="{{ url_for('book_platform.view_book', book_id=book.id) }}" 
                                   class="btn btn-secondary">
                                    Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i> Save Chapter
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts remain identical to preserve functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <script src="{{ url_for('static', filename='ai_assistant.js') }}?v=2.0"></script>
    <script>
        let editor;

        ClassicEditor
            .create(document.querySelector('#editor'), {
                toolbar: {
                    items: [
                        'heading', '|',
                        'bold', 'italic', 'underline', 'strikethrough', 'subscript', 'superscript', '|',
                        'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', '|',
                        'bulletedList', 'numberedList', 'todoList', '|',
                        'alignment', '|',
                        'blockQuote', 'insertTable', '|',
                        'link', 'imageUpload', 'mediaEmbed', '|',
                        'horizontalLine', 'pageBreak', '|',
                        'undo', 'redo'
                    ]
                },
                language: 'en'
            })
            .then(newEditor => {
                editor = newEditor;
                editor.plugins.get('FileRepository').createUploadAdapter = function(loader) {
                    return new UploadAdapter(loader);
                };
            })
            .catch(err => console.error(err));

        class UploadAdapter {
            constructor(loader) { this.loader = loader; }
            upload() {
                return this.loader.file.then(file => new Promise((resolve, reject) => {
                    const data = new FormData();
                    data.append('upload', file);
                    const urlParts = window.location.pathname.split('/');
                    const bookId = urlParts[urlParts.indexOf('books') + 1];
                    const chapterId = urlParts[urlParts.indexOf('chapters') + 1] || 'draft';
                    
                    fetch(`/mybook/books/${bookId}/chapters/${chapterId}/upload-image`, {
                        method: 'POST', body: data
                    }).then(r => r.json()).then(res => {
                        if (res.success) resolve({ default: res.url });
                        else reject(res.error);
                    }).catch(e => reject(e.message));
                }));
            }
            abort() {}
        }

        document.getElementById('createChapterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (editor) document.getElementById('content').value = editor.getData();
            const formData = new FormData(this);
            try {
                const response = await fetch('{{ url_for("book_platform.create_chapter", book_id=book.id) }}', {
                    method: 'POST', body: formData
                });
                const result = await response.json();
                if (result.success) {
                    showNotification('Chapter created successfully!', 'success');
                    setTimeout(() => window.location.href = result.redirect || '{{ url_for("book_platform.view_book", book_id=book.id) }}', 1500);
                } else showNotification(result.error || 'Failed to create chapter', 'error');
            } catch (error) { showNotification('Error creating chapter', 'error'); }
        });

        function showNotification(message, type = 'info') {
            const el = document.createElement('div');
            el.className = `alert ${type==='success'?'alert-success':'alert-danger'} position-fixed shadow`;
            el.style.cssText = 'top:20px; right:20px; z-index:9999; border-radius:10px; border:none; background:var(--glass-bg); color:#fff; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1);';
            el.innerHTML = message;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
    </script>
</body>
</html>
