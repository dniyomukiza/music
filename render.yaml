services:
  - type: web
    name: icecast2
    runtime: docker
    dockerfilePath: ./Dockefileice  # Path to the Dockerfile in your repo
    plan: starter

    # Mount a disk for persistent storage if needed (e.g., for logs or configurations)
    disk:
      name: icefiles
      mountPath: /etc/conf_files/  # Mount location for persistent storage
      sizeGB: 10  # Size of the mounted disk

    # Optional: Override the run command if needed, although CMD in the Dockerfile is usually sufficient
    dockerCommand: |
      icecast -c /etc/icecast.xml  # Ensure Icecast starts with the correct config

  