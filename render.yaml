services:
  - type: web
    name: icecast2
    runtime: image
    image:
      url: deepcomp/icecast2
    plan: starter
    envVars:
      - key: PORT
        value: 8000    

    disk:
      name: icecast-data
      mountPath: /etc/icecast
      sizeGB: 10
  
  - type: pserv
    name: liquidsoap
    runtime: image
    image:
      url: docker.io/phasecorex/liquidsoap:latest
    plan: starter
    dockerCommand: >
      liquidsoap /liqfolder/scripts/main.liq