services:
  app:
    image: myapp:latest
    container_name: myapp
    build:
      context: .
    depends_on:
      - icecast2
    volumes:
      - ./music:/usr/src/appdir
    networks:
      - app_network
    command: >
      sh -c "gunicorn -b 0.0.0.0:5000 run:app"
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development

  nginx:
    image: custom-nginx
    container_name: nginx_service
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Assuming your nginx.conf is in the root of the project
    ports:
      - "80:80"  # Expose port 80 for HTTP traffic
    networks:
      - app_network

  icecast2:
    image: deepcomp/icecast2
    container_name: icecast_server
    ports:
      - "8000:8000"
    volumes:
      - ./icecast.xml:/etc/icecast.xml
    networks:
      - app_network
    command: /usr/bin/icecast -c /etc/icecast.xml -b
    

  liquidsoap:
    image: phasecorex/liquidsoap:latest 
    container_name: liquidsoap_service
    depends_on:
      - icecast2
    volumes:
      - ./:/liqfolder
    networks:
      - app_network
    command: liquidsoap /liqfolder/scripts/main.liq

networks:
  app_network:
    driver: bridge
