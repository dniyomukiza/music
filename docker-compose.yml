services:
  app:
    image: myapp:latest
    container_name: myapp
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - icecast2
    volumes:
      - .:/usr/src/appdir
      - /etc/glconfig.json:/etc/glconfig.json:ro
      # If cookies file in ~/music on host instead of project root, uncomment and set your home path:
      # - /home/YOUR_USER/music:/ytdlp_cookies_mount:ro
    command: >
     sh -c "python run.py"
    mem_limit: 4g  # Increased for news generation and TTS processing
    mem_reservation: 2g  # Increased minimum memory reservation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
 
    ports:
      - "5000:5000"
    networks:
      app_network:
        aliases: [myapp]
    # Values here are fallbacks; prefer setting secrets in .env (copy from .env.example). Do not commit .env with real keys.
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=run.py
      - FLASK_ENV=${FLASK_ENV:-development}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_AI_KEY=${OPENAI_AI_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-tts.json}
      - DATABASE_URL=${DATABASE_URL}
      - DB_URL=${DB_URL:-${DATABASE_URL}}
      - SENDER_MAIL=${SENDER_MAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - RECEIVER_MAIL=${RECEIVER_MAIL}
      - RECAPTCHAPUB=${RECAPTCHAPUB}
      - RECAPTCHAPRIV=${RECAPTCHAPRIV}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAIL_TRAP=${MAIL_TRAP}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-/usr/src/appdir/ytdlp_cookiesfull.txt}

  nginx:
      build:
        context: .
        dockerfile: Dockerfile.nginx
      container_name: nginx_service
      depends_on:
        app:
          condition: service_healthy
        fastapi:
          condition: service_started
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf 
        - /etc/letsencrypt/live/www.glc.cool:/etc/letsencrypt/live/www.glc.cool:ro
        - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro

      ports:
        - "80:80"
        - "443:443"
      networks:
        - app_network

  icecast2:
    image: deepcomp/icecast2
    container_name: icecast_server
    ports:
      - "8000:8000"
    volumes:
      - ./icecast.xml:/etc/icecast.xml
    networks:
      - app_network
    command: /usr/bin/icecast -c /etc/icecast.xml -b
    restart: unless-stopped
    mem_limit: 256M
    mem_reservation: 128M
    healthcheck:
      test: ["CMD", "pgrep", "icecast"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email didyom1@gmail.com --agree-tos --no-eff-email
      -d www.glc.cool -d glc.cool"
    depends_on:
      - nginx
    networks:
      - app_network

  liquidsoap:
    image: phasecorex/liquidsoap:latest 
    container_name: liquidsoap_service
    depends_on:
      - icecast2
    volumes:
      - ./:/liqfolder
    networks:
      - app_network
    command: liquidsoap /liqfolder/scripts/main.liq
    environment:
     - TZ=America/New_York
    restart: unless-stopped
    mem_limit: 512M
    mem_reservation: 256M
    healthcheck:
      test: ["CMD", "pgrep", "liquidsoap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.uvi
    container_name: fastapi
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./glconnect:/app/glconnect
      - /etc/glconfig.json:/etc/glconfig.json
    networks:
      - app_network
    environment:
      - DB_URL=${DB_URL:-${DATABASE_URL}}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    mem_limit: 256M
    mem_reservation: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app_network:
    driver: bridge
