services:
  app:
    image: myapp:latest
    container_name: myapp
    build:
      context: .
    depends_on:
      - icecast2
    volumes:
      - .:/usr/src/appdir
    networks:
      - app_network
    command: >
     sh -c "python run.py"
    mem_limit: 4g  # Increased for news generation and TTS processing
    mem_reservation: 2g  # Increased minimum memory reservation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
 
    ports:
      - "5000:5000"
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - GOOGLE_API_KEY=AIzaSyA-HyErhz4omhMWSqN_hID1aQOwRtrzV1Q
      - OPENAI_AI_KEY=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
      - GOOGLE_APPLICATION_CREDENTIALS=tts.json
      - DATABASE_URL=postgresql://music_owqr_user:D8SRPZ7ubYN79Pdh6E8aKzg4O2yirBrL@dpg-ct1ae39u0jms73cdpjdg-a.oregon-postgres.render.com/music_owqr
      - SENDER_MAIL=info@ndotonic.com
      - SENDER_PASSWORD=uivaqvvdohjovkhi
      - RECAPTCHAPUB=6LfdZjgrAAAAADyijAp1kSulPN7ZFAWk01fJzaPz
      - RECAPTCHAPRIV=6LfdZjgrAAAAAI2jKpHvpDeXAKK0IuhMMXjul-RK
      - GEMINI_API_KEY=AIzaSyAN9PhRQkawgarggs44LB0TlX3DH5HxeyI

  nginx:
      build:
        context: .
        dockerfile: Dockerfile.nginx
      container_name: nginx_service
      depends_on:
        - app
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf 
        - /etc/letsencrypt/live/www.glc.cool:/etc/letsencrypt/live/www.glc.cool:ro
        - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro

      ports:
        - "80:80"
        - "443:443"
      networks:
        - app_network

  icecast2:
    image: deepcomp/icecast2
    container_name: icecast_server
    ports:
      - "8000:8000"
    volumes:
      - ./icecast.xml:/etc/icecast.xml
    networks:
      - app_network
    command: /usr/bin/icecast -c /etc/icecast.xml -b
    restart: unless-stopped
    mem_limit: 256M
    mem_reservation: 128M
    healthcheck:
      test: ["CMD", "pgrep", "icecast"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email didyom1@gmail.com --agree-tos --no-eff-email
      -d www.glc.cool -d glc.cool"
    depends_on:
      - nginx
    networks:
      - app_network

  liquidsoap:
    image: phasecorex/liquidsoap:latest 
    container_name: liquidsoap_service
    depends_on:
      - icecast2
    volumes:
      - ./:/liqfolder
    networks:
      - app_network
    command: liquidsoap /liqfolder/scripts/main.liq
    environment:
     - TZ=America/New_York
    restart: unless-stopped
    mem_limit: 512M
    mem_reservation: 256M
    healthcheck:
      test: ["CMD", "pgrep", "liquidsoap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.uvi
    container_name: fastapi
    ports:
      - "8002:8002"
    volumes:
      - ./glconnect:/app/glconnect
      - /etc/glconfig.json:/etc/glconfig.json
    networks:
      - app_network
    mem_limit: 256M
    mem_reservation: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

 

networks:
  app_network:
    driver: bridge
