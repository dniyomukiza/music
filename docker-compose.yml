# Memory budget (~4GB VPS): app + fastapi + liquidsoap + icecast + nginx + OS/Docker overhead.
# Override: APP_MEM_LIMIT=2g docker compose up -d
services:
  app:
    image: myapp:latest
    container_name: myapp
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - icecast2
    volumes:
      - .:/usr/src/appdir
      - /etc/glconfig.json:/etc/glconfig.json:ro
      # If cookies file in ~/music on host instead of project root, uncomment and set your home path:
      # - /home/YOUR_USER/music:/ytdlp_cookies_mount:ro
    command: >
     sh -c "python run.py"
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    mem_reservation: ${APP_MEM_RESERVATION:-384m}
    restart: unless-stopped
    healthcheck:
      # Use Python (always in image). curl is often missing on slim images until rebuilt → false "unhealthy".
      # Long start_period + retries: first boot can be slow (DB, imports, SocketIO); avoid false "unhealthy".
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=10); exit(0 if r.status == 200 else 1)\"",
        ]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 360s
 
    ports:
      - "5000:5000"
    networks:
      app_network:
        aliases: [myapp]
    # Secrets and API keys: set them in `.env` only (env_file above). Do NOT repeat them here as
    # `KEY=${KEY}` — when Compose interpolation is empty, that overrides env_file with blank strings.
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=run.py
      - FLASK_ENV=${FLASK_ENV:-development}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-tts.json}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-/usr/src/appdir/ytdlp_cookiesfull.txt}

  nginx:
      build:
        context: .
        dockerfile: Dockerfile.nginx
      container_name: nginx_service
      depends_on:
        app:
          condition: service_healthy
        fastapi:
          condition: service_started
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf 
        - ./hls-video:/var/www/hls-video:ro
        - /etc/letsencrypt/live/www.glc.cool:/etc/letsencrypt/live/www.glc.cool:ro
        - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro

      ports:
        - "80:80"
        - "443:443"
      networks:
        - app_network
      mem_limit: 128M
      mem_reservation: 64M

  icecast2:
    image: deepcomp/icecast2
    container_name: icecast_server
    ports:
      - "8000:8000"
    volumes:
      - ./icecast.xml:/etc/icecast.xml
    networks:
      - app_network
    command: /usr/bin/icecast -c /etc/icecast.xml -b
    restart: unless-stopped
    mem_limit: 192M
    mem_reservation: 96M
    healthcheck:
      test: ["CMD", "pgrep", "icecast"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email didyom1@gmail.com --agree-tos --no-eff-email
      -d www.glc.cool -d glc.cool"
    depends_on:
      - nginx
    networks:
      - app_network
    mem_limit: 256M
    mem_reservation: 64M

  liquidsoap:
    image: phasecorex/liquidsoap:latest 
    container_name: liquidsoap_service
    depends_on:
      - icecast2
    volumes:
      - ./:/liqfolder
    networks:
      - app_network
    command: liquidsoap /liqfolder/scripts/main.liq
    environment:
     - TZ=America/New_York
    restart: unless-stopped
    mem_limit: 384M
    mem_reservation: 128M
    healthcheck:
      test: ["CMD", "pgrep", "liquidsoap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional video-only Liquidsoap: HLS (H.264/AAC) → ./hls-video, served at https://glc.cool/hls/
  # Enable: docker compose --profile video up -d
  # Disable: docker compose --profile video stop liquidsoap_video  (or never pass --profile video)
  # Requires ./video/videolist.m3u with at least one valid path (see video/videolist.m3u.example).
  liquidsoap_video:
    image: phasecorex/liquidsoap:latest
    container_name: liquidsoap_video_service
    profiles:
      - video
    volumes:
      - ./:/liqfolder
    networks:
      - app_network
    command: liquidsoap /liqfolder/scripts/video.liq
    environment:
      - TZ=America/New_York
    restart: unless-stopped
    mem_limit: ${LIQUIDSOAP_VIDEO_MEM_LIMIT:-1536m}
    mem_reservation: ${LIQUIDSOAP_VIDEO_MEM_RESERVATION:-256m}
    healthcheck:
      test: ["CMD", "pgrep", "liquidsoap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.uvi
    container_name: fastapi
    env_file:
      - .env
    environment:
      - MALLOC_ARENA_MAX=2
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    ports:
      - "8002:8002"
    volumes:
      - ./glconnect:/app/glconnect
      - /etc/glconfig.json:/etc/glconfig.json
    networks:
      - app_network
    # ADK/Gemini imports need more headroom than a minimal API; 384M is a frugal default for ~4GB hosts.
    mem_limit: ${FASTAPI_MEM_LIMIT:-384m}
    mem_reservation: ${FASTAPI_MEM_RESERVATION:-96m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app_network:
    driver: bridge
