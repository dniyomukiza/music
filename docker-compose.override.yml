services:
  app:
    # Defaults match docker-compose.yml (~4GB host). Scale up: APP_MEM_LIMIT=2g docker compose up -d
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    mem_reservation: ${APP_MEM_RESERVATION:-384m}

    # Environment variables for memory optimization
    environment:
      - MALLOC_ARENA_MAX=1
      - MALLOC_MMAP_THRESHOLD_=65536
      - MALLOC_TRIM_THRESHOLD_=65536
      - MALLOC_TOP_PAD_=65536
      - MALLOC_MMAP_MAX_=32768
      - PYTHONHASHSEED=0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=1
      # Align with APP_MEM_LIMIT (frugal default ~4GB hosts)
      - GUNICORN_WORKER_MEMORY_LIMIT=${GUNICORN_WORKER_MEMORY_LIMIT:-768}
      # yt-dlp uses optional Node; cap V8 heap so one challenge solver cannot balloon RAM.
      - NODE_OPTIONS=--max-old-space-size=256
    
    # DNS configuration for external API access
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    
    # Healthcheck: do not override here — base docker-compose.yml uses Python urllib because
    # the myapp image (python:3.10-slim + ffmpeg) does not install curl; curl here breaks
    # service_healthy and leaves Compose stuck on "Container myapp Wait..." forever.

    # Restart policy
    restart: unless-stopped
    
    # 128m saves RAM vs 256m; raise to 256m if heavy in-container FFmpeg/temp I/O faults appear.
    shm_size: 128m
