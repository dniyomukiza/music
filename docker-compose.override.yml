version: '3.8'

services:
  app:
    # Memory optimizations for container environments
    mem_limit: 4G  # Increased for news generation and TTS processing
    mem_reservation: 2G  # Increased minimum memory reservation
    
    # Environment variables for memory optimization
    environment:
      - MALLOC_ARENA_MAX=1
      - MALLOC_MMAP_THRESHOLD_=65536
      - MALLOC_TRIM_THRESHOLD_=65536
      - MALLOC_TOP_PAD_=65536
      - MALLOC_MMAP_MAX_=32768
      - PYTHONHASHSEED=0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=1
      - GUNICORN_WORKER_MEMORY_LIMIT=2048  # Increased to 2GB for news generation
    
    # DNS configuration for external API access
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    
    # Health check using simple HTTP request
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Shared memory for temporary files
    shm_size: 256m  # Increased for news generation (was 128m)
