server {
    listen 80;
    server_name www.glc.cool glc.cool;

    # Serve the challenge files for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (non-www version as canonical)
    location / {
        return 301 https://glc.cool$request_uri;  # Redirect www to non-www (or vice versa)
    }
}

server {
    listen 443 ssl;
    server_name www.glc.cool glc.cool;

    ssl_certificate /etc/letsencrypt/live/www.glc.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.glc.cool/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # Proxy to your backend app (Flask or other)
    location / {
        proxy_pass http://app:5000;  # Replace with your backend service (e.g., Flask app)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
