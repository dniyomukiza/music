# Redirect non-www to www on HTTPS
server {
    listen 443 ssl;
    server_name glc.cool;

    ssl_certificate /etc/letsencrypt/live/www.glc.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.glc.cool/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:
                 ECDHE-RSA-AES128-GCM-SHA256:
                 DHE-RSA-AES128-GCM-SHA256:
                 ECDHE-ECDSA-AES128-SHA256:
                 ECDHE-RSA-AES128-SHA256:
                 DHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # Redirect all non-www requests to www
    return 301 https://www.glc.cool$request_uri;
}
server {
    listen 80;
    server_name glc.cool www.glc.cool;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.glc.cool$request_uri;
    }
}

# Main HTTPS Server Block (www.glc.cool is canonical)
server {
    listen 443 ssl;
    server_name www.glc.cool;

    ssl_certificate /etc/letsencrypt/live/www.glc.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.glc.cool/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:
                 ECDHE-RSA-AES128-GCM-SHA256:
                 DHE-RSA-AES128-GCM-SHA256:
                 ECDHE-ECDSA-AES128-SHA256:
                 ECDHE-RSA-AES128-SHA256:
                 DHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # SSL security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Proxy /art/ with trailing slash on proxy_pass
    location /art/ {
        proxy_pass http://myapp:5000/art/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /station {
        proxy_pass http://icecast_server:8000/station; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://icecast_server:8000/status.xsl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /word/ {
        proxy_pass http://fastapi:8002/word/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy root / to backend
    location / {
        proxy_pass http://myapp:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header 'Access-Control-Allow-Origin' 'https://www.glc.cool';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        add_header 'Access-Control-Allow-Credentials' 'true';
    }
}
