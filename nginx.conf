# HTTP to HTTPS Redirect (non-www canonical)
server {
    listen 80;
    server_name www.glc.cool glc.cool;

    # Serve the challenge files for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS non-www
    location / {
        return 301 https://glc.cool$request_uri;
    }
}

# Main HTTPS Server Block (glc.cool is canonical)
server {
    listen 443 ssl;
    server_name glc.cool; # Only glc.cool should serve content directly

    # *** ADD REDIRECT FOR WWW TO NON-WWW HERE ***
    if ($host = www.glc.cool) {
        return 301 https://glc.cool$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/www.glc.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.glc.cool/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # Add SSL security headers (these are good)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # --- Start CORS Configuration Block ---
    # This block applies CORS headers to all relevant locations.
    # You could also add these directly into each location block,
    # but a shared block helps consistency.

    # Options method for preflight requests (needs to be before proxy_pass directives)
    location ~ ^/(art/|word/|other_api_path/) { # Adjust regex to include all your API paths
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://glc.cool'; # Explicitly allow canonical origin
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS'; # All methods your client uses
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization'; # All headers client sends
            add_header 'Access-Control-Allow-Credentials' 'true'; # CRUCIAL!
            add_header 'Access-Control-Max-Age' 1728000; # Cache preflight for 20 days
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204; # No content for OPTIONS
        }
    }
    # --- End CORS Configuration Block ---

    # Proxy to your backend app (Flask or other) for the root path
    location / {
        proxy_pass http://myapp:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Add CORS headers for the root path if it serves API requests from frontend
        add_header 'Access-Control-Allow-Origin' 'https://glc.cool';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        add_header 'Access-Control-Allow-Credentials' 'true';
    }

    # Proxy requests to /station to the Icecast service
    location /station {
        proxy_pass http://icecast_server:8000/station;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Add CORS headers here too if frontend fetches from /station
        add_header 'Access-Control-Allow-Origin' 'https://glc.cool';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
        add_header 'Access-Control-Allow-Credentials' 'true';
    }

    # Proxy requests to /admin/
    location /admin/ {
        proxy_pass http://icecast_server:8000/status.xsl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Add CORS headers here too if frontend fetches from /admin/
        add_header 'Access-Control-Allow-Origin' 'https://glc.cool';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
        add_header 'Access-Control-Allow-Credentials' 'true';
    }

    # Proxy requests to /art/
    location /art/ {
        proxy_pass http://myapp:5000/art/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS headers are added by the general OPTIONS block and specific location add_headers
    }

    # Proxy requests to /word/
    location /word/ {
        proxy_pass http://fastapi:8002/word/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS headers are added by the general OPTIONS block and specific location add_headers
    }
}