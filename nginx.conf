# HTTP → HTTPS for all hosts. ACME challenge is served before any redirect so
# Let's Encrypt can renew both ndotonic.com and glc.cool certs.
server {
    listen 80;
    server_name ndotonic.com www.ndotonic.com glc.cool www.glc.cool;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ndotonic.com$request_uri;
    }
}

# Redirect www.ndotonic.com → ndotonic.com (cert SAN includes www.ndotonic.com)
server {
    listen 443 ssl;
    server_name www.ndotonic.com;

    ssl_certificate /etc/letsencrypt/live/ndotonic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ndotonic.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://ndotonic.com$request_uri;
}

# Legacy glc.cool (+ www) → ndotonic.com. Uses the existing glc.cool cert so SNI
# presents a valid certificate for these names during/after migration.
server {
    listen 443 ssl;
    server_name glc.cool www.glc.cool;

    ssl_certificate /etc/letsencrypt/live/glc.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glc.cool/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://ndotonic.com$request_uri;
}

# Main HTTPS Server Block (ndotonic.com is canonical)
server {
    listen 443 ssl;
    server_name ndotonic.com;

    ssl_certificate /etc/letsencrypt/live/ndotonic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ndotonic.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # SSL security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # File upload size limit (50MB - matches Flask MAX_CONTENT_LENGTH)
    client_max_body_size 2048M;

    # Proxy /art/ with trailing slash on proxy_pass
    location /art/ {
        proxy_pass http://myapp:5000/art/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /station {
        proxy_pass http://icecast_server:8000/station; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HLS: Liquidsoap harbor (profile video) serves MPEG-TS; requires liquidsoap_video container running.
    location = /hls/status {
        proxy_pass http://myapp:5000/hls/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /hls/ {
        proxy_pass http://liquidsoap_video:8920/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin/ {
        proxy_pass http://icecast_server:8000/status.xsl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/music/ {
        proxy_pass http://fastapi:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    location /word/ {
    proxy_pass http://fastapi:8002/word/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
     }

    # WebSocket support for Socket.IO
    location /socket.io/ {
        proxy_pass http://myapp:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Proxy root / to backend
    location / {
        proxy_pass http://myapp:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header 'Access-Control-Allow-Origin' 'https://ndotonic.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        add_header 'Access-Control-Allow-Credentials' 'true';
        
        # Timeout settings for news generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }
}
