# HTTP server block for certbot challenge
server {
    listen 80;
    server_name www.glc.cool;

    # Serve the challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (optional, after certificate is issued)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block for your application
server {
    listen 443 ssl;
    server_name www.glc.cool;

    ssl_certificate /etc/letsencrypt/live/www.glc.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.glc.cool/privkey.pem;

    location / {
        proxy_pass http://myapp:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
